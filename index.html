<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d1f">
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CUBED" />
  <title>CUBED — Starting…</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#070918;color:#f5f7ff;font-family:system-ui,sans-serif;overflow:hidden}
    main{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
    .mark{font-size:34px;font-weight:800;letter-spacing:.18em}.mark b{color:#59e3ff}.status{margin:14px auto 0;color:#a8afc3;font-size:13px;line-height:1.5;max-width:560px}.retry{display:none;margin:18px auto 0;padding:10px 16px;border:1px solid #59e3ff;border-radius:10px;background:rgba(89,227,255,.14);color:#f5f7ff;font:600 13px system-ui;cursor:pointer}
    /* PWA-UPDATE-SYSTEM v2 */
    .update-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:rgba(15,20,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(251,191,36,.45);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:10px 14px;font-size:13px;color:#f1f5f9;max-width:calc(100vw - 24px)}
    .update-bar button{padding:6px 12px;border-radius:8px;font:600 12px system-ui;cursor:pointer;border:1px solid transparent}
    #updateNow{background:#fbbf24;color:#0f172a}
    #updateLater{background:#334155;color:#f1f5f9}
    .version-line{margin:18px auto 0;color:#8b93a7;font-size:11px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center}
    .version-line button{padding:3px 10px;border-radius:999px;background:transparent;border:1px solid #2a3352;color:#f5f7ff;font:600 11px system-ui;cursor:pointer}
  </style>
</head>
<body>
<main><div><div class="mark">CU<b>B</b>ED</div><div id="status" class="status">Opening the cube and 25 environments…</div><button id="retry" class="retry" type="button">TRY AGAIN</button><!-- PWA-UPDATE-SYSTEM v2 --><div class="version-line"><span>CUBED v<span id="appVersion"></span></span><span id="updateStatus"></span><button id="checkUpdates" hidden type="button">Check for updates</button></div></div></main>
<!-- PWA-UPDATE-SYSTEM v2 -->
<div class="update-bar" id="updateBar" role="status" aria-live="polite" hidden>
  <span id="updateText">A new version of CUBED is ready.</span>
  <span><button id="updateNow" type="button">Update now</button> <button id="updateLater" type="button">Later</button></span>
</div>
<script>
(() => {
  'use strict';
  const version = 'environment-runtime-20260718-7';
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  const environmentPatches = Array.from({length: 7}, (_, i) => `theme-patches/index-0${i + 1}.part`);
  const runtimeFix = 'theme-patches/environment-runtime-v7.patch';

  function applyUnifiedPatch(source, patchText) {
    const sourceLines = source.replace(/\r\n/g, '\n').split('\n');
    const patchLines = patchText.replace(/\r\n/g, '\n').split('\n');
    const output = [];
    let sourceIndex = 0;
    let i = 0;
    while (i < patchLines.length && !patchLines[i].startsWith('@@ ')) i++;
    while (i < patchLines.length) {
      const match = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/.exec(patchLines[i]);
      if (!match) { i++; continue; }
      const oldStart = Number(match[1]) - 1;
      while (sourceIndex < oldStart) output.push(sourceLines[sourceIndex++]);
      i++;
      while (i < patchLines.length && !patchLines[i].startsWith('@@ ')) {
        const line = patchLines[i];
        const mark = line[0];
        const text = line.slice(1);
        if (mark === ' ') {
          if (sourceLines[sourceIndex] !== text) throw new Error(`Patch context mismatch at ${sourceIndex + 1}`);
          output.push(sourceLines[sourceIndex++]);
        } else if (mark === '-') {
          if (sourceLines[sourceIndex] !== text) throw new Error(`Patch removal mismatch at ${sourceIndex + 1}`);
          sourceIndex++;
        } else if (mark === '+') {
          output.push(text);
        } else if (mark !== '\\' && line !== '' && !line.startsWith('--- ') && !line.startsWith('+++ ')) {
          throw new Error('Unsupported patch instruction');
        }
        i++;
      }
    }
    while (sourceIndex < sourceLines.length) output.push(sourceLines[sourceIndex++]);
    return output.join('\n');
  }

  async function fetchText(path) {
    const response = await fetch(`${path}?v=${version}`, {cache: 'no-store'});
    if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
    return response.text();
  }

  function openApplication(html) {
    document.open();
    document.write(html);
    document.close();
  }

  async function boot() {
    retry.style.display = 'none';
    status.textContent = 'Opening the cube and 25 environments…';
    try {
      const [legacy, environmentParts, fixPatch] = await Promise.all([
        fetchText('legacy.html'),
        Promise.all(environmentPatches.map(fetchText)),
        fetchText(runtimeFix)
      ]);
      const environmentBuild = applyUnifiedPatch(legacy, environmentParts.join(''));
      const completed = applyUnifiedPatch(environmentBuild, fixPatch);
      const environmentCount = (completed.match(/id: '[^']+', name:/g) || []).length;
      if (environmentCount !== 25 || !completed.includes('id="themeSelect"') || !completed.includes('id="environmentBackdrop"') || !completed.includes('Prism Festival')) {
        throw new Error(`Build verification failed (${environmentCount}/25 environments)`);
      }
      openApplication(completed);
    } catch (error) {
      console.error('CUBED startup failed', error);
      status.textContent = `CUBED could not start: ${error.message}. Tap TRY AGAIN after a moment.`;
      retry.style.display = 'inline-block';
    }
  }

  retry.addEventListener('click', boot);
  boot();
})();
</script>
<script>
  // PWA-UPDATE-SYSTEM v2: auto-update, version banner, Check for updates. Do not remove this line.
  // This is the loader page: it fetches legacy.html, applies the
  // theme patches, and document.writes the real app, which replaces
  // this document. The real app's own copy of this script (in
  // legacy.html) takes over from there and owns the unsaved-work
  // check; this copy only registers the worker and can show the
  // banner during the brief load. The loader itself keeps no state,
  // so it never reports unsaved work. The bridge lives in legacy.html
  // (window.__cubedUpdate on the let hudTimer line).
const APP_RELEASE='1.0.0-20261127-1';
const APP_VERSION='1.0.0';
  (function(){
    var LATER_KEY = 'cubed-update-later-v2';
    var BC_NAME = 'cubed-update-v2';

    document.getElementById('appVersion').textContent = APP_VERSION;
    var status = document.getElementById('updateStatus'), checkBtn = document.getElementById('checkUpdates'), bar = document.getElementById('updateBar');
    var say = function(t){ status.textContent = t; };
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    checkBtn.hidden = false;

    var reg = null, userAsked = false, reloading = false, verifying = false, updating = false;
    var remote = null, pendingRelease = null, checkPromise = null;
    var tabId = 'tab-' + Math.random().toString(36).slice(2) + Date.now().toString(36);

    // The loader page holds no cube state: there is never unsaved work here.
    function isDirty(){ return false; }

    // Multi-tab coordination over BroadcastChannel.
    var bc = null, bcWaiters = {};
    try { if ('BroadcastChannel' in window) bc = new BroadcastChannel(BC_NAME); } catch (e) {}
    if (bc) bc.onmessage = function(ev){
      var d = ev.data || {};
      if (d.type === 'update-query' && d.from !== tabId) {
        try { bc.postMessage({ type: 'update-response', id: d.id, from: tabId, blocked: isDirty() }); } catch (e) {}
      } else if (d.type === 'update-response' && bcWaiters[d.id]) {
        bcWaiters[d.id].push(d);
      }
    };
    function queryTabs(release){
      return new Promise(function(resolve){
        if (!bc) return resolve([]);
        var id = 'q-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        var answers = [];
        bcWaiters[id] = answers;
        try { bc.postMessage({ type: 'update-query', id: id, from: tabId, release: release }); } catch (e) {}
        setTimeout(function(){ delete bcWaiters[id]; resolve(answers); }, 800);
      });
    }

    function workerVersion(worker, ms){
      return new Promise(function(resolve){
        if (!worker || !('MessageChannel' in window)) return resolve(null);
        var done = false, timer = null;
        try {
          var ch = new MessageChannel();
          timer = setTimeout(function(){ if (!done) { done = true; resolve(null); } }, ms);
          ch.port1.onmessage = function(ev){
            if (done) return; done = true; clearTimeout(timer);
            var d = ev.data || {};
            resolve((d.release && d.displayVersion) ? d : null);
          };
          worker.postMessage({ type: 'GET_VERSION' }, [ch.port2]);
        } catch (e) { if (timer) clearTimeout(timer); resolve(null); }
      });
    }
    function workerClientCount(worker){
      return new Promise(function(resolve){
        if (!worker || !('MessageChannel' in window)) return resolve(null);
        var done = false, timer = null;
        try {
          var ch = new MessageChannel();
          timer = setTimeout(function(){ if (!done) { done = true; resolve(null); } }, 2000);
          ch.port1.onmessage = function(ev){
            if (done) return; done = true; clearTimeout(timer);
            var d = ev.data || {};
            resolve(typeof d.count === 'number' ? d.count : null);
          };
          worker.postMessage({ type: 'GET_CLIENTS' }, [ch.port2]);
        } catch (e) { if (timer) clearTimeout(timer); resolve(null); }
      });
    }
    function waitControllerChange(ms){
      return new Promise(function(resolve){
        var done = false;
        var timer = setTimeout(function(){ if (!done) { done = true; resolve(false); } }, ms);
        var onChange = function(){
          if (done) return; done = true; clearTimeout(timer);
          navigator.serviceWorker.removeEventListener('controllerchange', onChange);
          resolve(true);
        };
        navigator.serviceWorker.addEventListener('controllerchange', onChange);
      });
    }

    function showBar(display, release, manual){
      if (release) pendingRelease = release;
      var later = null;
      try { later = sessionStorage.getItem(LATER_KEY); } catch (e) {}
      document.getElementById('updateText').textContent = 'CUBED ' + (display ? 'v' + display + ' ' : '') + 'is ready.';
      if (later && release && later === release && !manual) return;
      bar.hidden = false;
      say('An update is ready.');
    }
    function fetchRemote(){
      return fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(function(info){ remote = (info && typeof info.release === 'string') ? info : null; return remote; })
        .catch(function(){ remote = null; return null; });
    }
    function maybeShowUpdate(manual){
      return fetchRemote().then(function(info){
        if (reg) return reg.update().catch(function(){}).then(function(){ return info; });
        return info;
      }).then(function(info){
        var w = reg && reg.waiting;
        if (!w || !navigator.serviceWorker.controller) {
          if (manual) {
            if (!info) say('Could not reach the server. Try again when you are online.');
            else if (info.release && info.release !== APP_RELEASE) say('Version ' + info.version + ' found. Downloading\u2026');
            else say('You have the latest version (' + APP_VERSION + ').');
          }
          return false;
        }
        return workerVersion(w, 2000).then(function(verified){
          if (verified) {
            if (info && info.release && verified.release !== info.release) {
              if (manual) say('The downloaded update did not match the published release. Try again.');
              return false;
            }
            showBar(verified.displayVersion, verified.release, manual);
            if (manual) say('An update is ready.');
            return true;
          }
          // Handshake failed: show the banner, but name no version.
          showBar(null, info && info.release, manual);
          if (manual) say('An update is ready.');
          return true;
        });
      });
    }
    function check(manual){
      if (checkPromise) return checkPromise;
      if (manual) { say('Checking\u2026'); checkBtn.disabled = true; }
      checkPromise = maybeShowUpdate(manual).catch(function(){ return false; }).then(function(ok){
        checkPromise = null;
        if (manual) checkBtn.disabled = false;
        return ok;
      });
      return checkPromise;
    }
    function track(w){
      if (!w) return;
      w.addEventListener('statechange', function(){
        if (w.state === 'installed') check(false);
      });
    }

    async function applyUpdate(){
      if (updating) return;
      updating = true;
      try {
        var w = reg && reg.waiting;
        if (!w) { say('No update is waiting. Tap Check for updates first.'); return; }
        var expected = pendingRelease || (remote && remote.release);
        // 1. No unsaved work exists on the loader page (see header
        // note), so there is nothing to save before activation.
        // 2. Coordinate with other tabs of this app.
        say('Checking other tabs\u2026');
        var answers = await queryTabs(expected);
        if (answers.some(function(a){ return a.blocked; })) {
          say('Another CUBED tab has an unsolved cube \u2014 solve or reset it there first, or close that tab.');
          return;
        }
        if (answers.length === 0) {
          var count = await workerClientCount(w);
          if (count === null || count > 1) {
            say('Another CUBED tab is open and couldn\u2019t confirm it\u2019s safe.');
            return;
          }
        }
        // 3. Activate only the specific waiting worker.
        say('Updating\u2026');
        userAsked = true;
        verifying = true;
        var changed = waitControllerChange(8000);
        w.postMessage({ type: 'SKIP_WAITING' });
        var ok = await changed;
        verifying = false;
        if (!ok) {
          userAsked = false;
          say('The update did not start. Tap Update now to try again, or Later to defer it.');
          return;
        }
        // 4. Verify the new controller really is the expected release,
        // then reload exactly once. No blind reload fallback exists.
        var info = await workerVersion(navigator.serviceWorker.controller, 2000);
        if (!info || (expected && info.release !== expected)) {
          userAsked = false;
          say('The update did not take over as expected. Tap Update now to try again, or Later to defer it.');
          return;
        }
        if (reloading) return;
        reloading = true;
        location.reload();
      } finally { updating = false; }
    }

    document.getElementById('updateNow').onclick = applyUpdate;
    document.getElementById('updateLater').onclick = function(){
      bar.hidden = true;
      try { sessionStorage.setItem(LATER_KEY, pendingRelease || (remote && remote.release) || '?'); } catch (e) {}
      say('Update postponed. You will be asked again next time you open the app, or tap Check for updates.');
    };
    checkBtn.onclick = function(){ check(true); };
    // A controllerchange on its own (first install, or an update
    // activated from another tab) never reloads this page: only an
    // explicit Update now in this tab does, after verification in
    // applyUpdate. There is deliberately no reload here.
    // Register immediately rather than on window load: this loader
    // replaces its own document with the real app via document.write,
    // so the load event is not a reliable hook here.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none', scope: './' }).then(function(r){
      reg = r;
      if (reg.waiting) check(false);
      track(reg.installing);
      reg.addEventListener('updatefound', function(){ track(reg.installing); });
      check(false);
    }).catch(function(){});
    var last = Date.now();
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible' && Date.now() - last > 5 * 60e3) { last = Date.now(); check(false); }
    });
    setInterval(function(){
      if (document.visibilityState === 'visible') { last = Date.now(); check(false); }
    }, 60 * 60e3);
  })();
</script>
</body>
</html>
